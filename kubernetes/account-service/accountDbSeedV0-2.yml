apiVersion: batch/v1
kind: Job
metadata:
  name: account-db-seed-v0-2
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: saujandsre/account-service:v0.2
          command: ["python", "-m", "app.seed"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: account-db-secret, key: DATABASE_URL}
