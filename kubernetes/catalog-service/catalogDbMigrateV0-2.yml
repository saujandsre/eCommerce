apiVersion: batch/v1
kind: Job
metadata:
  name: catalog-db-migrate-v0-2
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: catalog-db-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: saujandsre/catalog-service:v0.2
          command:
            - alembic
            - upgrade
            - head
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: catalog-db-secret
                  key: DATABASE_URL
