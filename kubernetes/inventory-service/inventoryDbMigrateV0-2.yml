apiVersion: batch/v1
kind: Job
metadata:
  name: inventory-db-migrate-v0-2
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: inventory-db-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: saujandsre/inventory-service:v0.2
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: inventory-db-secret
                  key: DATABASE_URL
