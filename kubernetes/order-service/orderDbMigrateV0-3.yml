apiVersion: batch/v1
kind: Job
metadata:
  name: order-db-migrate-v0-3
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: order-db-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: saujandsre/order-service:v0.3
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: order-db-secret
                  key: DATABASE_URL
